name: ImmortalWrt ImageBuilder X86

# 说明：这条工作流不做源码编译，直接跑官方 ImageBuilder 容器，
# 用 apk 装现成的软件包再打包成镜像，通常 10 分钟内出固件。
# 限制：只能装官方仓库里已有的包；passwall2 / clashoo / quickfile / partexp /
# run / aurora / ssr-plus 这类第三方插件没有预编译包，装不了 —— 要用源码那条
# 工作流（openwrt-builder.yml）才能带上。
#
# 为什么用 docker 镜像而不是官方 tar 包：
# 25.12.2 的 immortalwrt-imagebuilder-*-x86-64.Linux-x86_64.tar.zst 缺 packages/packages.adb，
# 装完包后 rootfs 里没有 /boot 内容，打包镜像会报 "cp: cannot stat .../root-x86/boot/." 失败。
# 官方 docker 镜像（immortalwrt/imagebuilder）结构完整，wukongdaily 也是走这个。
on:
  workflow_dispatch:
    inputs:
      rootfs_size_mb:
        description: "rootfs 分区大小（MB）"
        required: true
        default: "1024"
      extra_packages:
        description: "额外软件包（空格分隔，必须是官方仓库已有的包）"
        required: false
        default: ""

permissions:
  contents: write

env:
  IB_VER: "25.12.2"
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Pull imagebuilder image
      run: |
        set -e
        docker pull "immortalwrt/imagebuilder:x86-64-openwrt-${IB_VER}"
        docker run --rm "immortalwrt/imagebuilder:x86-64-openwrt-${IB_VER}" \
          /bin/bash -c 'cd /home/build/immortalwrt && pwd && ls | head -20'

    - name: Build image
      run: |
        set -e
        PKGS="luci-app-dockerman luci-i18n-dockerman-zh-cn docker docker-compose luci-app-sqm luci-i18n-sqm-zh-cn luci-app-ddns luci-i18n-ddns-zh-cn luci-app-wol luci-i18n-wol-zh-cn luci-app-upnp luci-i18n-upnp-zh-cn luci-app-commands luci-proto-wireguard luci-app-ttyd luci-i18n-ttyd-zh-cn luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn openssh-sftp-server curl ca-bundle"
        [ -n "${{ inputs.extra_packages }}" ] && PKGS="$PKGS ${{ inputs.extra_packages }}"
        echo "==== 包列表 ===="
        echo "$PKGS"
        mkdir -p bin_out
        docker run --rm --user root \
          -v "$GITHUB_WORKSPACE/bin_out:/home/build/immortalwrt/bin" \
          -v "$GITHUB_WORKSPACE/files_ib:/home/build/immortalwrt/files" \
          -e PKGS="$PKGS" \
          -e ROOTFS_SIZE="${{ inputs.rootfs_size_mb }}" \
          "immortalwrt/imagebuilder:x86-64-openwrt-${IB_VER}" \
          /bin/bash -c 'cd /home/build/immortalwrt && make image PROFILE="generic" PACKAGES="$PKGS" FILES="/home/build/immortalwrt/files" ROOTFS_PARTSIZE="$ROOTFS_SIZE"'
        echo "==== 产物 ===="
        ls -lh bin_out/targets/x86/64/ 2>/dev/null || ls -lhR bin_out | head -40

    - name: Fix ownership of build output
      run: |
        # 容器以 root 运行，产物回写到宿主是 root 所有，后续 mv 会 Permission denied
        sudo chown -R "$(id -u):$(id -g)" bin_out
        ls -lh bin_out/targets/x86/64/ 2>/dev/null || true

    - name: Collect firmware
      run: |
        set -e
        cd bin_out/targets/x86/64
        rm -rf packages
        for f in *; do
          [ -f "$f" ] || continue
          case "$f" in
            *combined-efi.img.gz) mv "$f" "ImmortalWrt-IB-${IB_VER}-x86_64-combined-efi.img.gz" ;;
            *combined.img.gz) mv "$f" "ImmortalWrt-IB-${IB_VER}-x86_64-combined.img.gz" ;;
          esac
        done
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        ls -lh

    - name: Generate release tag
      id: tag
      run: |
        echo "release_tag=IB-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        {
          echo "ImmortalWrt ${IB_VER} · x86_64 · ImageBuilder 快速出包"
          echo ""
          echo "rootfs 分区 ${{ inputs.rootfs_size_mb }}MiB；默认 LAN 192.168.100.1"
          echo "本包由官方 ImageBuilder 组装，不含第三方源码插件"
        } > release-ib.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release-ib.txt
        files: |
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/*.tar.gz
          ${{ env.FIRMWARE }}/*.manifest
