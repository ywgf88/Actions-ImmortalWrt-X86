#
# 基于 P3TERX/Actions-OpenWrt 模板改造
# X86_64 · ImmortalWrt(openwrt-25.12) · 版本标识 25.12.2 · 默认 IPv4 · 自定义插件集
#
name: ImmortalWrt Builder X86
on:
  workflow_dispatch:
  repository_dispatch:
permissions:
  contents: write
  actions: write
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        # runner 偶发 DNS 解析失败会让 apt 一个包都装不上（另外两个 x86 仓库 11-11 就是这样挂的）。
        # 加固三层：DNS 兜底 + apt 内建重试 + 整体重试 3 轮。
        if ! getent hosts archive.ubuntu.com >/dev/null 2>&1; then
          echo "::warning::runner 解析 archive.ubuntu.com 失败，写入公共 DNS 兜底"
          sudo sh -c 'printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\n" > /etc/resolv.conf'
        fi
        APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        PKGS="ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev"
        retry_apt() {
          n=0
          until "$@"; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::apt 连续 3 次失败，runner 网络或 DNS 异常，稍后重跑即可"
              return 1
            fi
            echo "::warning::apt 第 $n 次失败，20 秒后重试"
            sleep 20
          done
        }
        retry_apt sudo -E apt-get -qq $APT_OPTS update
        retry_apt sudo -E apt-get -qq $APT_OPTS install $PKGS
        sudo -E apt-get -qq $APT_OPTS autoremove --purge
        sudo -E apt-get -qq $APT_OPTS clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    - name: Load custom feeds
      run: |
        if [ -f "$FEEDS_CONF" ]; then mv "$FEEDS_CONF" openwrt/feeds.conf.default; fi
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a
    - name: Load custom configuration
      run: |
        if [ -d files ]; then mv files openwrt/files; fi
        if [ -f "$CONFIG_FILE" ]; then mv "$CONFIG_FILE" openwrt/.config; fi
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"
    - name: Verify configuration
      run: |
        cd openwrt
        make defconfig 2>&1 | tee /tmp/defconfig.log
        echo "==== Target ===="
        grep -E '^CONFIG_TARGET_(x86|x86_64)' .config || true
        echo "==== 版本标识 ===="
        grep -n '25\.12\.2' include/version.mk | head -3 || true
        grep -q '25\.12\.2' include/version.mk || { echo "::error::版本号未改为 25.12.2"; exit 1; }
        echo "==== 分区 ===="
        grep -E '^CONFIG_TARGET_(KERNEL|ROOTFS)_PARTSIZE' .config || true
        grep -q '^CONFIG_TARGET_x86_64=y' .config || { echo "::error::未选中 x86_64 目标"; exit 1; }
        grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=1024' .config || { echo "::error::ROOTFS 分区不是 1024MiB（1G）"; exit 1; }
        # 内核 IPv6 必须保持 y：nftables 的 kmod 在 FILES 里引用了 net/ipv6/netfilter/*.ko。
        # 默认 IPv4 单栈靠运行时禁用实现，见 diy-part2.sh。
        grep -q '^CONFIG_IPV6=y' .config || echo "::warning::内核 CONFIG_IPV6 未启用，kmod-nft-core 打包可能失败"
        if [ -f package/base-files/files/etc/sysctl.d/99-ipv4-only.conf ]; then
          echo "OK  IPv4 单栈（运行时 disable_ipv6 已写入）"
        else
          echo "::error::缺少 99-ipv4-only.conf，默认网络不会是纯 IPv4"
          exit 1
        fi
        # 依赖缺失告警：一旦出现，相关包会被 defconfig 清掉，不必等两小时编译
        # 已知无害项（在真机预验证里逐条确认过）：ssr-plus 的 dns2socks-rust 与
        # shadowsocks-libev-ss-* 挂在默认关闭的可选 INCLUDE 选项上，而 25.12 的 feeds
        # 本身已不再提供这几个包（shadowsocks-libev 已整体移出 feeds），不启用就永不解析到。
        echo "==== defconfig 依赖缺失检查 ===="
        BENIGN='dns2socks-rust|shadowsocks-libev-ss-(local|redir|server)'
        MISS_DEP=0
        grep "which does not exist" /tmp/defconfig.log | head -20 > /tmp/depmiss.log || true
        if [ -s /tmp/depmiss.log ]; then
          while IFS= read -r line; do
            if echo "$line" | grep -Eq "$BENIGN"; then
              echo "::warning::已知无害（未启用的 ssr-plus 可选模式）：$line"
            else
              echo "::error::依赖缺失：$line"
              MISS_DEP=$((MISS_DEP + 1))
            fi
          done < /tmp/depmiss.log
          if [ "$MISS_DEP" -ne 0 ]; then
            echo "::error::共 $MISS_DEP 处依赖缺失，继续编译会得到缺插件的固件，停止"
            exit 1
          fi
        else
          echo "OK  没有包的依赖缺失"
        fi
        # defconfig 里偶发 "recursive dependency detected!"，来自 dnsdist / weechat / snort3 /
        # knot-resolver / openappid 这些与本次无关的 feed 包，不影响目标插件，仅提示
        grep "recursive dependency detected!" /tmp/defconfig.log | wc -l | xargs -I{} echo "recursive dependency 告警数（来自无关 feed 包）：{}"
        # 2026-11-12 起 ssr-plus 整体移除：它是唯一会牵扯 rust 生态的应用，
        # 而 rust 1.96.0 的 host 编译要从 ci 拉预编译 LLVM（链接已 404），
        # 导致每轮都在 2h44m 处失败（run #4）。这里改成"必须不在配置里"，编前就拦住。
        if grep -qE '^CONFIG_PACKAGE_luci-app-ssr-plus=y' .config; then
          echo "::error::ssr-plus 仍在配置里，会拉 rust host 编译（上游 ci-llvm 已 404，必然失败）"
          grep -E 'ssr-plus' .config || true
          exit 1
        fi
        for bad in shadowsocks-rust rust; do
          if grep -qE "^CONFIG_PACKAGE_${bad}=y" .config; then
            echo "::error::${bad} 被选进来了，会触发 host rustc 编译（上游 ci-llvm 已 404，必然失败）"
            grep -E "^CONFIG_PACKAGE_${bad}" .config || true
            exit 1
          fi
        done
        echo "OK  ssr-plus 已移除，rust / shadowsocks-rust 均不在编译列表"
        # 必需包逐个校验：缺任何一个都直接失败，避免编出一个少插件的固件
        miss=0
        for p in luci-app-run luci-app-quickfile quickfile luci-theme-aurora \
                 luci-app-partexp luci-theme-argon luci-theme-vantage \
                 luci-app-passwall2 clashoo luci-app-clashoo \
                 docker dockerd luci-app-dockerman luci-app-diskman; do
          if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
            echo "OK  $p"
          else
            echo "::error::必需包 ${p} 未被选中（包名或依赖可能有问题）"
            grep -E "^(# )?CONFIG_PACKAGE_${p}" .config \
              || echo "  .config 中无该符号（包未被 metadata 识别）"
            if [ -f "package/${p}/Makefile" ]; then
              grep -nE '^[[:space:]]*(LUCI_)?DEPENDS' "package/${p}/Makefile" | head -6 \
                || echo "  Makefile 中无 DEPENDS 行"
            fi
            miss=$((miss+1))
          fi
        done
        if [ "$miss" -ne 0 ]; then
          echo "::error::共 $miss 个必需包未选中，停止编译"
          exit 1
        fi
        echo "==== 配置校验通过 ===="
    # 缓存两样东西：ccache（重复的 C/C++ 编译直接命中）和 dl（源码 tarball，省下载）
    # key 用 .config 的 hash + run_id：每次新 key 便于保存，restore-keys 保证能捞到上一版
    - name: Restore ccache and dl cache
      id: cache-restore
      uses: actions/cache@v4
      with:
        path: |
          /workdir/openwrt/.ccache
          /workdir/openwrt/dl
        key: ccache-${{ github.repository }}-${{ hashFiles('openwrt/.config') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.repository }}-${{ hashFiles('openwrt/.config') }}-
          ccache-${{ github.repository }}-
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile the firmware
      id: compile
      env:
        CCACHE_DIR: /workdir/openwrt/.ccache
        CCACHE_MAXSIZE: 3G
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        ccache -M 3G >/dev/null 2>&1 || true
        echo "==== ccache 编译前状态 ===="
        ccache -s 2>/dev/null || echo "(ccache 不可用)"
        set +e
        make -j$(nproc) 2>&1 | tee /tmp/build-j.log
        rc=${PIPESTATUS[0]}
        if [ "$rc" -ne 0 ]; then
          echo "::warning::并行编译失败 (exit $rc)，改用单线程重试"
          make -j1 V=s 2>&1 | tee /tmp/build-1.log
          rc=${PIPESTATUS[0]}
        fi
        if [ "$rc" -ne 0 ]; then
          log=/tmp/build-1.log
          [ -s "$log" ] || log=/tmp/build-j.log
          echo "==== 编译失败：磁盘空间 ===="
          df -hT
          echo "==== 编译失败：错误行（最后 40 条） ===="
          grep -nE "make(\[[0-9]+\])?: \*\*\*|Error [0-9]+|error:|fatal error:|No space left on device|missing dependencies|undefined reference|failed to build|ERROR:" "$log" | tail -40
          echo "==== 编译失败：日志末尾 60 行 ===="
          tail -60 "$log"
          echo "==== 以下诊断行同步写入 annotations ===="
          {
            grep -nE "make(\[[0-9]+\])?: \*\*\*|Error [0-9]+|error:|fatal error:|No space left on device|missing dependencies|failed to build|ERROR:" "$log" | tail -20
            df -hT | tail -3
          } | while IFS= read -r line; do
            line=${line//%/%25}
            line=${line//$'\r'/}
            echo "::error::$line"
          done
          exit "$rc"
        fi
        echo "==== ccache 命中统计 ===="
        ccache -s 2>/dev/null || true
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_x86_64" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
    - name: Check space usage
      if: (!cancelled())
      run: df -hT
    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ImmortalWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "ImmortalWrt 25.12.2 · x86_64 · 默认 IPv4"
          echo ""
          echo "rootfs 分区 1024MiB；默认 LAN 192.168.100.1"
          echo "插件：luci-app-run / luci-app-quickfile / luci-theme-aurora / luci-app-partexp"
          echo "      PassWall2(ssrp=xray) / SSR Plus / Clashoo / Docker(dockerman) / DiskMan"
          echo "主题：Argon（默认）+ Vantage + Aurora"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        # 只上传真正的镜像，不要用 /* —— 避免把 runner 根目录的 /swapfile 扫进去
        files: |
          ${{ env.FIRMWARE }}/*.img.gz
          ${{ env.FIRMWARE }}/*.tar.gz
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*.bin
    # 调试期先禁用：失败记录被自动删除会妨碍排查
    # - name: Delete workflow runs
    #   uses: Mattraks/delete-workflow-runs@main
    #   with:
    #     retain_days: 0
    #     keep_minimum_runs: 2
